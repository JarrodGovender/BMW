name: Hourly Gauteng Lead Ingest Pipeline

on:
  schedule:
    - cron: '0 4 * * *'  # Executes precisely at 06:00 AM South African Standard Time every morning
  workflow_dispatch:     # Allows manually triggering via the button click

jobs:
  scrape_and_inject:
    runs-on: ubuntu-latest
    steps:
      - name: Codebase Extraction
        uses: actions/checkout@v3

      - name: Set up Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Production Requirements
        run: |
          pip install requests beautifulsoup4 supabase pytz

      - name: Execute Scraping Pipeline Run
        env:
          SUPABASE_KEY: "sb_publishable_9C4lD6aJd1h9cIq0SqVanA_6Yz_mvs_"
        run: |
          python scraper.py
