name: Hourly Gauteng Lead Ingest Pipeline

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  scrape_and_inject:
    runs-on: ubuntu-latest
    steps:
      - name: Codebase Extraction
        uses: actions/checkout@v3

      - name: Set up Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Production Requirements
        run: |
          pip install requests beautifulsoup4 supabase pytz

      - name: Execute Scraping Pipeline Run
        env:
          SUPABASE_KEY: "YOUR_SUPABASE_ANON_OR_SERVICE_ROLE_KEY"
        run: |
          python scraper.py
