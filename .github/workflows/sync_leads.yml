name: Hourly Gauteng Lead Ingest Pipeline

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  scrape_and_inject:
    runs-on: ubuntu-latest
    steps:
      - name: Codebase Extraction
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Production Requirements
        run: |
          pip install requests beautifulsoup4 supabase pytz

      - name: Execute Scraping Pipeline Run
        env:
          SUPABASE_KEY: "sb_publishable_9C4lD6aJd1h9cIq0SqVanA_6Yz_mvs_"
        run: |
          python scraper.py
- name: Run Commercial Real Estate Lead Ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python cre_scraper.py
