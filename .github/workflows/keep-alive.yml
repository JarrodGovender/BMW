name: Keep-Alive Ping

on:
  schedule:
    # Runs every 2 hours, Monday through Friday (Weekdays)
    - cron: '0 */2 * * 1-5'
    # Runs every 1 hour on Saturday and Sunday (Weekends)
    - cron: '0 * * * 0,6'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the application
        # Adding -f to fail on server errors, and --retry to handle transient blips
        run: |
          curl -f -I https://bmwsandtonleads.streamlit.app || echo "Ping failed, but continuing..."
